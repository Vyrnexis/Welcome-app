name       : solus-welcome
version    : 0.2.0
release    : 1
source     :
    - https://github.com/Vyrnexis/welcome-app/archive/refs/tags/v0.2.0.tar.gz : # TODO: Replace with sha256 hash after tagging v0.2.0
homepage   : https://github.com/Vyrnexis/welcome-app
license    : MIT
component  : desktop
summary    : Welcome and first-run setup for Solus
description: |
    Solus Welcome is a native desktop welcome and setup application for the
    Solus Linux distribution, built with Go and Fyne.
# Solus packaging policy prefers vendored modules; networking is enabled for go module downloads.
networking : yes
builddeps  :
    - golang
    - pkgconfig(gl)
    - pkgconfig(x11)
    - pkgconfig(xcursor)
    - pkgconfig(xi)
    - pkgconfig(xinerama)
    - pkgconfig(xrandr)
    - pkgconfig(xxf86vm)
build      : |
    go build -trimpath -ldflags="-s -w" -o solus-welcome ./src
install    : |
    install -Dm00755 solus-welcome $installdir/usr/bin/solus-welcome
    install -Dm00644 data/us.getsol.SolusWelcome.desktop $installdir/usr/share/applications/us.getsol.SolusWelcome.desktop
    install -Dm00644 data/us.getsol.SolusWelcome-autostart.desktop $installdir/etc/xdg/autostart/us.getsol.SolusWelcome.desktop
    install -Dm00644 assets/logo.svg $installdir/usr/share/icons/hicolor/scalable/apps/us.getsol.SolusWelcome.svg
