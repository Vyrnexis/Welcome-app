[[DesktopActions.xfce]]
Title = "Settings Manager"
Body = "Launch the Xfce settings manager."
Command = ["xfce4-settings-manager"]
[[DesktopActions.xfce]]
Title = "Appearance"
Body = "Change GTK theme, icons, fonts, and toolbar style."
