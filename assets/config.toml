[[DesktopActions.gnome]]
Title = "Settings"
Body = "Launch GNOME Settings."
Command = ["gnome-control-center"]
[[DesktopActions.gnome]]
Title = "Appearance"
Body = "Change style, background, and dock options."
Command = ["gnome-control-center", "background"]
[[DesktopActions.gnome]]
Title = "Displays"
Body = "Configure monitors, scale, refresh rate, and layout."
Command = ["gnome-control-center", "display"]
[[DesktopActions.gnome]]
Title = "Sound"
Body = "Configure speakers, microphones, and alert sounds."
Command = ["gnome-control-center", "sound"]
[[DesktopActions.gnome]]
Title = "Power"
Body = "Configure power saving and suspend behaviour."
Command = ["gnome-control-center", "power"]
[[DesktopActions.gnome]]
