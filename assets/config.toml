# Desktop-specific actions for the Customise page
[[DesktopActions.kde]]
Title = "System Settings"
Body = "Launch the KDE Plasma settings centre."
Command = ["systemsettings"]
[[DesktopActions.kde]]
Title = "Appearance"
Body = "Change Plasma style, colours, icons, and global theme."
Command = ["kcmshell6", "kcm_lookandfeel"]
[[DesktopActions.kde]]
Title = "Colours"
Body = "Adjust KDE colour schemes."
Command = ["kcmshell6", "kcm_colors"]
[[DesktopActions.kde]]
Title = "Displays"
Body = "Configure monitors, scale, refresh rate, and layout."
Command = ["kcmshell6", "kcm_kscreen"]

[[DesktopActions.budgie]]
Title = "Budgie Desktop Settings"
Body = "Adjust panels, applets, Raven, desktop icons, and style."
Command = ["budgie-desktop-settings"]
[[DesktopActions.budgie]]
Title = "System Settings"
Body = "Open Budgie Control Center for system-wide preferences."
Command = ["budgie-control-center"]
[[DesktopActions.budgie]]
Title = "Wallpapers"
Body = "Choose desktop backgrounds."
Command = ["budgie-control-center", "background"]
[[DesktopActions.budgie]]
Title = "Notifications"
Body = "Manage notification behaviour."
Command = ["budgie-control-center", "notifications"]
[[DesktopActions.budgie]]
Title = "Sound"
Body = "Configure speakers, microphones, and alert sounds."
Command = ["budgie-control-center", "sound"]
[[DesktopActions.budgie]]
Title = "Printers"
Body = "Add and manage printers."
Command = ["budgie-control-center", "printers"]
[[DesktopActions.budgie]]
Title = "Power"
Body = "Configure power saving and suspend behaviour."
Command = ["budgie-control-center", "power"]
[[DesktopActions.budgie]]
Title = "Keyboard and shortcuts"
Body = "Adjust typing settings and keyboard shortcuts."
