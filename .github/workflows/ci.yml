name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true

    - name: Install System Dependencies
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update -qq
        sudo apt-get install -yq libgl1-mesa-dev xorg-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev libxxf86vm-dev libwayland-dev libxkbcommon-dev desktop-file-utils

    - name: Verify Code Formatting
      run: |
        if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
          echo "The following files are not formatted correctly:"
          gofmt -s -l .
          exit 1
        fi

    - name: Run go vet
      run: go vet ./...

    - name: Run Tests
      run: go test -v -race ./...

    - name: Build Application
      run: go build -tags wayland -trimpath -ldflags="-s -w" -o bin/solus-welcome ./src

    - name: Test Staged Installation
      run: |
        chmod +x test/install_test.sh
        ./test/install_test.sh

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: solus-welcome
        path: bin/solus-welcome

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Download Build Artifact
      uses: actions/download-artifact@v4
      with:
        name: solus-welcome
        path: release-bin

    - name: Install Release Dependency
      run: sudo apt-get install -yq upx

    - name: Package Release Assets
      run: |
        upx --best --lzma release-bin/solus-welcome
        ARCHIVE_NAME="solus-welcome-${{ github.ref_name }}-linux-x86_64.tar.gz"
        STAGING_DIR="$(mktemp -d)"
        mkdir -p "$STAGING_DIR/bin"
        cp release-bin/solus-welcome "$STAGING_DIR/bin/"
        cp -r assets src solus-welcome.desktop install.sh README.md go.mod go.sum "$STAGING_DIR/"
        tar -czf "$ARCHIVE_NAME" -C "$STAGING_DIR" bin assets src solus-welcome.desktop install.sh README.md go.mod go.sum
        for required_path in bin/solus-welcome assets/config.toml src/main.go install.sh go.mod go.sum; do
          tar -tzf "$ARCHIVE_NAME" "$required_path" >/dev/null
        done
        rm -rf "$STAGING_DIR"
        sha256sum "$ARCHIVE_NAME" > checksums.txt

    - name: Create GitHub Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "${{ github.ref_name }}" \
          "solus-welcome-${{ github.ref_name }}-linux-x86_64.tar.gz" \
          "checksums.txt" \
          --title "Solus Welcome ${{ github.ref_name }}" \
          --generate-notes
