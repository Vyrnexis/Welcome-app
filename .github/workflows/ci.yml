name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true

    - name: Install System Dependencies
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update -qq
        sudo apt-get install -yq libgl1-mesa-dev xorg-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev libxxf86vm-dev libwayland-dev libxkbcommon-dev desktop-file-utils shellcheck

    - name: Verify Code Formatting
      run: |
        if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
          echo "The following files are not formatted correctly:"
          gofmt -s -l .
          exit 1
        fi

    - name: Check Go Module Tidiness
      run: go mod tidy -diff

    - name: Lint Shell Scripts
      run: shellcheck install.sh test/install_test.sh

    - name: Validate Desktop Files
      run: desktop-file-validate data/*.desktop

    - name: Run go vet
      run: |
        go vet ./...
        go vet -tags wayland ./...

    - name: Run Tests
      run: go test -race ./...

    # GLFW supports one windowing system per binary, so both backends are built and released.
    - name: Build Application
      run: |
        go build -trimpath -ldflags="-s -w" -o bin/solus-welcome ./src
        go build -tags wayland -trimpath -ldflags="-s -w" -o dist/wayland/solus-welcome ./src
        mkdir -p dist/x11
        cp bin/solus-welcome dist/x11/solus-welcome

    - name: Test Staged Installation
      run: |
        chmod +x test/install_test.sh
        ./test/install_test.sh

    - name: Upload Build Artifact
      if: startsWith(github.ref, 'refs/tags/v')
      uses: actions/upload-artifact@v4
      with:
        name: solus-welcome
        path: dist/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Download Build Artifact
      uses: actions/download-artifact@v4
      with:
        name: solus-welcome
        path: release-bin

    - name: Package Release Assets
      run: |
        PACKAGE_DIR_NAME="solus-welcome-${{ github.ref_name }}"
        : > checksums.txt
        for backend in x11 wayland; do
          ARCHIVE_NAME="solus-welcome-${{ github.ref_name }}-linux-x86_64-$backend.tar.gz"
          STAGING_DIR="$(mktemp -d)"
          PACKAGE_DIR="$STAGING_DIR/$PACKAGE_DIR_NAME"
          mkdir -p "$PACKAGE_DIR/bin" "$PACKAGE_DIR/data"
          install -m755 "release-bin/$backend/solus-welcome" "$PACKAGE_DIR/bin/solus-welcome"
          cp data/us.getsol.SolusWelcome.desktop "$PACKAGE_DIR/data/"
          cp data/us.getsol.SolusWelcome-autostart.desktop "$PACKAGE_DIR/data/"
          cp assets/logo.svg "$PACKAGE_DIR/data/us.getsol.SolusWelcome.svg"
          cp install.sh README.md LICENSE "$PACKAGE_DIR/"
          tar -czf "$ARCHIVE_NAME" -C "$STAGING_DIR" "$PACKAGE_DIR_NAME"
          for required_path in bin/solus-welcome data/us.getsol.SolusWelcome.desktop data/us.getsol.SolusWelcome-autostart.desktop data/us.getsol.SolusWelcome.svg install.sh README.md LICENSE; do
            tar -tzf "$ARCHIVE_NAME" "$PACKAGE_DIR_NAME/$required_path" >/dev/null
          done
          for excluded_path in src go.mod go.sum assets; do
            if tar -tzf "$ARCHIVE_NAME" "$PACKAGE_DIR_NAME/$excluded_path" >/dev/null 2>&1; then
              echo "Unexpected source path in release archive: $excluded_path" >&2
              exit 1
            fi
          done
          rm -rf "$STAGING_DIR"
          sha256sum "$ARCHIVE_NAME" >> checksums.txt
        done

    - name: Create GitHub Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "${{ github.ref_name }}" \
          "solus-welcome-${{ github.ref_name }}-linux-x86_64-x11.tar.gz" \
          "solus-welcome-${{ github.ref_name }}-linux-x86_64-wayland.tar.gz" \
          "checksums.txt" \
          --title "Solus Welcome ${{ github.ref_name }}" \
          --generate-notes
